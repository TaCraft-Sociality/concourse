ernestdefoe-concourse:
  admin:
    settings:
      show_profile_label: 显示个人名片
      show_profile_help: 在右侧栏顶部显示当前读者的个人名片，包含背景封面、头像、签名以及“编辑个人资料”按钮。游客则会看到论坛的欢迎信息以及“注册”和“登录”按钮。
      show_contributors_label: 显示活跃贡献者（排行榜）
      show_contributors_help: 显示在所选时间段内获得最多点赞（如果未安装点赞插件，则为发表评论最多）的用户。仅统计公开的讨论。
      contributors_period_label: 活跃贡献者默认显示的时间段
      contributors_period_help: 访客首次看到的时间段。他们可以在今天、本周、本月和今年之间切换。
      period_day: 今天
      period_week: 本周
      period_month: 本月
      period_year: 今年
      contributors_count_label: 活跃贡献者显示人数
      contributors_count_help: 在 1 到 10 之间。
      show_participants_label: 显示参与讨论的用户
      show_participants_help: 在讨论列表的每个帖子下方以及讨论页的侧边面板中显示用户的小头像。
      footer_links_label: 侧边栏底部链接
      footer_links_help: "每行一个链接，格式为：名称 | 地址。地址可以是本论坛的页面（如 /p/about）或完整的 https:// 链接。"
